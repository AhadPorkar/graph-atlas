# Replace repo.example.com and certificate paths before loading this configuration.
server {
    listen 80;
    server_name repo.example.com;
    return 308 https://repo.example.com$request_uri;
}
server {
    listen 443 ssl;
    server_name repo.example.com;
    ssl_certificate /etc/letsencrypt/live/repo.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/repo.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 0;
    merge_slashes off;
    location / {
        # No URI suffix and no rewrite: preserve raw encoded npm paths.
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # The app uses GR_PUBLIC_URL, not untrusted forwarded-host headers.
    }
}
