name: Package candidate (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python scripts/check_repository.py
      - run: npm test
      - run: bash scripts/build.sh
      - name: Create the source distribution
        run: python scripts/package_source.py --output dist/graph-atlas-source.zip
      - name: Upload candidate files (does not create a public release)
        uses: actions/upload-artifact@v6
        with:
          name: graph-atlas-candidate
          path: |
            dist/graph-repository.jar
            dist/graph-repository.jar.sha256
            dist/graph-atlas-source.zip
            dist/graph-atlas-source.zip.sha256
